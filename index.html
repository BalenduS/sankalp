<style>
:root{
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#2A1A0E; --muted:#8A7462; --line:#F0E2CF;
  --saffron:#E8650F; --saffron2:#F59E2B; --deep:#B8420A; --soft:#FFEBD2; --ok:#2F9E5B; --okSoft:#DDF3E5;
  --miss:#D9483B; --missSoft:#FCE3E0; --shadow:0 1px 2px rgba(80,40,0,.06),0 6px 20px rgba(120,60,0,.07);
  --r:20px; --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17110C;--card:#231A13;--ink:#F6E9DA;--muted:#B39C86;--line:#3A2B1F;--soft:#3A2412;--okSoft:#173623;--missSoft:#3D1A16;--shadow:0 1px 2px rgba(0,0,0,.4)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:16px}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--saffron)}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--safeT) + 14px) 16px calc(var(--safeB) + 96px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top img{width:42px;height:42px;border-radius:12px}
.top h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.off{background:#BBB}.dot.wait{background:var(--saffron2)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:26px 4px 10px;font-weight:700}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.sd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sd-title{font-weight:800;font-size:19px;line-height:1.2}
.sd-meta{color:var(--muted);font-size:13px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--deep);font-weight:700;font-size:12px;padding:5px 10px;border-radius:99px;white-space:nowrap}
@media (prefers-color-scheme:dark){.pill{color:#FFB26B}}
.pill.ok{background:var(--okSoft);color:var(--ok)}
.counter{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0 8px}
.ring{position:relative;width:168px;height:168px;border-radius:50%;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .08s}
.ring:active{transform:scale(.96)}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .inner{width:136px;height:136px;border-radius:50%;background:linear-gradient(160deg,var(--saffron2),var(--saffron) 55%,var(--deep));display:grid;place-items:center;color:#fff;box-shadow:inset 0 -6px 14px rgba(0,0,0,.15),0 8px 22px rgba(232,101,15,.35);text-align:center}
.ring.done .inner{background:linear-gradient(160deg,#58C27F,var(--ok))}
.ring .big{font-size:40px;font-weight:800;line-height:1}
.ring .small{font-size:12px;opacity:.9;margin-top:4px;font-weight:600}
.side{display:flex;flex-direction:column;gap:10px}
.mini{width:48px;height:48px;border-radius:50%;background:var(--soft);font-size:20px;font-weight:800;display:grid;place-items:center;color:var(--deep)}
.mini.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.hint{text-align:center;color:var(--muted);font-size:13px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.dots i{width:11px;height:11px;border-radius:4px;background:var(--line);display:block}
.dots i.done{background:var(--saffron)}
.dots i.partial{background:var(--saffron2);opacity:.5}
.dots i.missed{background:var(--miss)}
.dots i.today,.dots i.partial-today{outline:2px solid var(--saffron);outline-offset:1px;background:var(--soft)}
.dots i.partial-today{background:var(--saffron2)}
.dots i.excused{background:transparent;border:1.5px dashed var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;background:var(--soft);color:var(--deep)}
@media (prefers-color-scheme:dark){.btn{color:#FFB26B}}
.btn.primary{background:var(--saffron);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:12px}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--missSoft);color:var(--miss)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.banner{border-radius:16px;padding:14px 16px;margin-bottom:14px;background:var(--soft);font-size:14px;line-height:1.45}
.banner.miss{background:var(--missSoft)}
.banner b{display:block;margin-bottom:4px;font-size:15px}
.empty{text-align:center;padding:30px 10px}
.empty img{width:96px;height:96px;border-radius:26px;margin-bottom:12px;box-shadow:var(--shadow)}
.empty h3{margin:6px 0;font-size:22px}
.empty p{color:var(--muted);margin:6px 0 18px;line-height:1.5}
.fam{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.fam:last-child{border:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.fam .t{flex:1;min-width:0}.fam .n{font-weight:700}.fam .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{font-size:20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safeB);z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs button.on{color:var(--saffron)}
nav.tabs svg{width:24px;height:24px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(var(--safeB) + 80px);width:58px;height:58px;border-radius:20px;background:var(--saffron);color:#fff;font-size:30px;box-shadow:0 10px 24px rgba(232,101,15,.45);z-index:21;display:grid;place-items:center}
.sheet-bg{position:fixed;inset:0;background:rgba(30,15,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(var(--safeB) + 22px);animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0 0 4px;font-size:22px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:15px}
.chip.on{border-color:var(--saffron);background:var(--soft);color:var(--deep)}
@media (prefers-color-scheme:dark){.chip.on{color:#FFB26B}}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plans .chip{text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:0 2px 5px}
details.guide{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
details.guide summary{font-weight:700;cursor:pointer}
details.guide ul{padding-left:18px;margin:8px 0 0;line-height:1.55;font-size:14px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 2px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--saffron)}.sw.on::after{left:23px}
.reader{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;animation:fade .2s}
.reader header{display:flex;align-items:center;gap:8px;padding:calc(var(--safeT) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
.reader header .ttl{flex:1;font-weight:800}
.reader .body{flex:1;overflow:auto;padding:22px 20px 40px;max-width:640px;margin:0 auto;width:100%}
.verse{display:flex;gap:12px;margin:0 0 18px;line-height:1.75}
.verse .no{color:var(--saffron);font-weight:700;font-size:13px;min-width:20px;padding-top:.45em}
.verse .tx{font-family:"Noto Serif Devanagari","Noto Serif Telugu",serif;font-weight:500}
.tel .verse .tx{font-family:"Noto Serif Telugu",serif}
.verse .alt{font-size:.62em;color:var(--muted);white-space:nowrap}
.reader .ttl{font-family:"Noto Serif Devanagari","Noto Serif Telugu",Figtree,serif}
.tel .ttl,.tel .doha small{font-family:"Noto Serif Telugu",serif;letter-spacing:0;text-transform:none}
.doha small{font-size:12px}
.tel .doha small{font-size:14px}
.doha{text-align:center;margin:8px 0 26px;font-family:"Noto Serif Devanagari","Noto Serif Telugu",serif;line-height:1.8;color:var(--deep)}
@media (prefers-color-scheme:dark){.doha{color:#FFB26B}}
.doha small{display:block;font-family:Figtree;font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.reader footer{padding:12px 16px calc(var(--safeB) + 12px);border-top:1px solid var(--line);background:var(--card)}
.seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px}
.seg button{padding:6px 10px;border-radius:9px;font-weight:700;font-size:13px}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 150px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:90;max-width:90vw;text-align:center;animation:up .25s}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:1px;background:var(--soft);padding:10px 14px;border-radius:12px;text-align:center;font-weight:700}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border:0}
.muted{color:var(--muted)}
.burst{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.burst span{position:absolute;font-size:26px;animation:fly 1.4s ease-out forwards}
.center-msg{position:fixed;inset:0;display:grid;place-items:center;z-index:96;pointer-events:none}
.center-msg div{background:var(--card);padding:22px 28px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.2);text-align:center;font-weight:800;font-size:20px;animation:pop 1.8s ease forwards}
.center-msg small{display:block;font-weight:600;font-size:14px;color:var(--muted);margin-top:4px}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.2) rotate(var(--r));opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}12%{transform:scale(1.08);opacity:1}22%{transform:scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.95) translateY(-10px)}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
/* ---- motion ---- */
.wrap.enter .card,.wrap.enter h2,.wrap.enter .banner{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.top img{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(245,158,43,0))}50%{filter:drop-shadow(0 0 10px rgba(245,158,43,.55))}}
.ring .ripple{position:absolute;left:50%;top:50%;width:136px;height:136px;margin:-68px 0 0 -68px;border-radius:50%;border:3px solid var(--saffron2);pointer-events:none;animation:ripple .7s ease-out forwards}
@keyframes ripple{from{transform:scale(1);opacity:.8}to{transform:scale(1.45);opacity:0}}
.ring.bump .inner{animation:bump .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
.ring.bump .big{animation:numpop .35s ease-out}
@keyframes numpop{0%{transform:translateY(8px);opacity:.3}100%{transform:none;opacity:1}}
.ring.done::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(88,194,127,.35) 0%,rgba(88,194,127,0) 70%);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.06);opacity:1}}
.ring:not(.done) .inner::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);background-size:250% 100%;animation:sheen 3.8s ease-in-out infinite}
.ring .inner{position:relative;overflow:hidden}
@keyframes sheen{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.floater{position:fixed;z-index:80;pointer-events:none;font-weight:800;font-size:26px;color:var(--saffron);text-shadow:0 2px 8px rgba(232,101,15,.35);animation:floatup .9s ease-out forwards}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
.dots i.today,.dots i.partial-today{animation:tick 1.8s ease-in-out infinite}
@keyframes tick{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.dots i.justdone{animation:dotpop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes dotpop{0%{transform:scale(.2)}60%{transform:scale(1.6)}100%{transform:scale(1)}}
.streak{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:12px;padding:5px 9px;border-radius:99px;background:linear-gradient(135deg,#FFE3B3,#FFC27A);color:#9A3A05;margin-right:6px}
.streak b{display:inline-block;animation:flicker 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flicker{0%,100%{transform:rotate(-4deg) scale(1)}25%{transform:rotate(3deg) scale(1.08)}50%{transform:rotate(-2deg) scale(.96)}75%{transform:rotate(4deg) scale(1.05)}}
nav.tabs button.on svg{animation:tabpop .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes tabpop{0%{transform:scale(.7) translateY(3px)}100%{transform:none}}
.fab{transition:transform .2s}.fab:active{transform:rotate(90deg) scale(.92)}
.fam .check{display:inline-block}
.wrap.enter .fam .check{animation:checkpop .5s cubic-bezier(.3,1.8,.5,1) both;animation-delay:.25s}
@keyframes checkpop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.reader footer .btn.primary{position:relative;overflow:hidden}
.reader footer .btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:250% 100%;animation:sheen 3s ease-in-out infinite}
.rain{position:fixed;inset:0;pointer-events:none;z-index:94;overflow:hidden}
.rain span{position:absolute;top:-40px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}
.center-msg .big{font-size:34px;display:block;margin-bottom:4px}
.empty img{animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.onb{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:440px;margin:0 auto;padding:24px 20px}
.onb .logo{width:112px;height:112px;border-radius:30px;margin:0 auto 18px;box-shadow:0 18px 40px rgba(232,101,15,.3);display:block}
.onb h1{text-align:center;font-size:30px;margin:0;letter-spacing:-.5px}
.onb .tag{text-align:center;color:var(--muted);margin:8px 0 28px;line-height:1.5}
.onb .stack{display:flex;flex-direction:column;gap:12px}
.or{text-align:center;color:var(--muted);font-size:13px;margin:6px 0}
</style>

<script>
// ------------------------------------------------------------------ config
const CFG = { url: 'https://ndmkdkvtpbbsiawnuwuv.supabase.co', key: 'sb_publishable_Lu-_StyBdRFy0Jd5VCmPdw_fiKeeX8m' };
const FN = CFG.url + '/functions/v1/sankalp';
const COLORS = ['#E8650F', '#2F7FD8', '#2F9E5B', '#9B4DCA', '#D9483B', '#C08A12'];

// ------------------------------------------------------------------ the text
// Text as in Gita Press, Gorakhpur — Shri Hanuman Chalisa (book 1917)
const CHALISA = {
  open: ['श्रीगुरु चरन सरोज रज निज मनु मुकुरु सुधारि।', 'बरनउँ रघुबर बिमल जसु जो दायकु फल चारि॥', 'बुद्धिहीन तनु जानिके, सुमिरौं पवन-कुमार।', 'बल बुधि बिद्या देहु मोहिं, हरहु कलेस बिकार॥'],
  verses: [
    'जय हनुमान ज्ञान गुन सागर। जय कपीस तिहुँ लोक उजागर॥',
    'राम दूत अतुलित बल धामा। अंजनि-पुत्र पवनसुत नामा॥',
    'महाबीर बिक्रम बजरंगी। कुमति निवार सुमति के संगी॥',
    'कंचन बरन बिराज सुबेसा। कानन कुंडल कुंचित केसा॥',
    'हाथ बज्र औ ध्वजा बिराजै। काँधे मूँज जनेऊ साजै॥',
    'संकर सुवन केसरीनंदन। तेज प्रताप महा जग बंदन॥',
    'बिद्यावान गुनी अति चातुर। राम काज करिबे को आतुर॥',
    'प्रभु चरित्र सुनिबे को रसिया। राम लषन सीता मन बसिया॥',
    'सूक्ष्म रूप धरि सियहिं दिखावा। बिकट रूप धरि लंक जरावा॥',
    'भीम रूप धरि असुर सँहारे। रामचंद्र के काज सँवारे॥',
    'लाय सजीवन लखन जियाये। श्रीरघुबीर हरषि उर लाये॥',

// Devanagari → Telugu: the two Unicode blocks share a layout (offset 0x300).
function toTelugu(s) {
  const t = s
    // Telugu print writes a nasal before a stop consonant as anusvara: मन्त्र → మంత్ర, अम्बा → అంబా
    .replace(/[ङञणनम]्(?=[क-घच-झट-ढत-धप-भ])/g, 'ं')
    .replace(/[ऀ-ॿ]/g, (ch) => {
      if (ch === '़') return '';            // nukta
      if (ch === '।' || ch === '॥') return ch;   // dandas are shared
      if (ch === 'ँ') return 'ం';          // chandrabindu → anusvara (Telugu convention)
      if (ch === 'ॐ') return 'ఓం';              // Om has no Telugu code point
      return String.fromCharCode(ch.charCodeAt(0) + 0x300);
    });
  // titles and jaikara use the Telugu form హనుమాన్ (verses keep హనుమాన, as in printed Telugu Chalisa)
  return t.replace(/^శ్రీహనుమానచాలీసా$/, 'శ్రీహనుమానచాలీసా');
}

const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => iso(new Date());
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };

const hm = (t) => { if (!t) return ''; const [h, m] = t.split(':').map(Number); const d = new Date(); d.setHours(h, m); return d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }); };

// The daily count can change mid-way; earlier days keep the count that applied then.
function targetOn(s, date) {
  const h = s.target_history || [];
  let t = s.daily_target;
  for (let i = h.length - 1; i >= 0; i--) { if (date < h[i].until) t = h[i].target; else break; }
  return t;
}
const logOf = (sid, date) => S.data.logs.find((l) => l.sadhana_id === sid && l.log_date === date)?.count || 0;

function dayNo(s, date) {
  const k = diff(s.start_date, date);
  if (k < 0 || k >= span(s) || exc(s).includes(date)) return null;
  return k + 1 - exc(s).filter((d) => d < date).length;
}
function dayStates(s) {
  const t = today(), out = [];
  for (let i = 0; i < span(s); i++) {
    const d = addDays(s.start_date, i); let st;
    if (exc(s).includes(d)) st = 'excused';
    else {
      const c = logOf(s.id, d);
      if (c >= targetOn(s, d)) st = 'done';
      else if (d > t) st = 'future';
      else if (d === t) st = c > 0 ? 'partial-today' : 'today';
      else st = c > 0 ? 'partial' : 'missed';
    }
    out.push({ d, st });
  }
  return out;
}
const missedDates = (s) => s.status !== 'active' ? [] : dayStates(s).filter((x) => x.st === 'missed' || x.st === 'partial').map((x) => x.d);
const doneCount = (s) => dayStates(s).filter((x) => x.st === 'done').length;
const isRunning = (s, t = today()) => s.status === 'active' && diff(s.start_date, t) >= 0 && diff(s.start_date, t) < span(s);
const isUpcoming = (s, t = today()) => s.status === 'active' && diff(s.start_date, t) < 0;

function save() { LS.set('data', S.data); }
function queue(op) {
  // collapse repeated writes to the same row so rapid taps send one request
  const from = S.flushing ? 1 : 0;
  const i = S.outbox.findIndex((o, idx) => idx >= from && o.key && o.key === op.key);
  if (i >= 0) S.outbox[i] = op; else S.outbox.push(op);
  LS.set('outbox', S.outbox);
  renderSync(); flush();
}
async function flush() {
  const c = client();
  if (!c || S.flushing || !S.outbox.length || !navigator.onLine) return;
  S.flushing = true; renderSync();
  try {
    while (S.outbox.length) {
      const op = S.outbox[0]; let r;
      if (op.t === 'upsert') r = await c.from(op.table).upsert(op.row, op.conflict ? { onConflict: op.conflict } : undefined);
      else if (op.t === 'update') r = await c.from(op.table).update(op.row).eq('id', op.id);
      else if (op.t === 'delete') r = await c.from(op.table).delete().eq('id', op.id);
      if (r && r.error) {
        if (!r.error.code || /fetch|network/i.test(r.error.message || '')) { S.syncErr = true; break; } // offline: retry later
        console.warn('dropped write', op, r.error);
      }
      S.syncErr = false;
      S.outbox.shift(); LS.set('outbox', S.outbox);
    }
  } catch (e) { S.syncErr = true; } finally { S.flushing = false; renderSync(); }
}
async function pull() {
  const c = client(); if (!c || !S.user || !S.family || !navigator.onLine) return;
  await flush(); if (S.outbox.length) return;
  try {
    const [m, s, l] = await Promise.all([
      c.from('sk_members').select('*').order('created_at'),
      c.from('sk_sadhanas').select('*').order('created_at'),
      c.from('sk_logs').select('sadhana_id,log_date,member_id,count'),
    ]);
    if (m.error || s.error || l.error) throw (m.error || s.error || l.error);
    if (S.outbox.length) return; // a tap happened mid-fetch; next pull will catch up
    S.data = { members: m.data, sadhanas: s.data, logs: l.data };
    S.lastSync = Date.now(); S.syncErr = false; save();
    autoComplete();
    render();
  } catch (e) { S.syncErr = true; renderSync(); }
}

}

  n = Math.max(0, n);
  const row = { sadhana_id: s.id, log_date: date, family_code: S.family, member_id: s.member_id, count: n, updated_at: new Date().toISOString() };
  const i = S.data.logs.findIndex((l) => l.sadhana_id === s.id && l.log_date === date);
  if (i >= 0) S.data.logs[i] = row; else S.data.logs.push(row);
  save();
  queue({ t: 'upsert', table: 'sk_logs', row, conflict: 'sadhana_id,log_date', key: 'log:' + s.id + ':' + date });
}
function updateSadhana(s, patch) {
  Object.assign(s, patch, { updated_at: new Date().toISOString() }); save();
  queue({ t: 'update', table: 'sk_sadhanas', id: s.id, row: { ...patch, updated_at: s.updated_at } });
}
function tap(id, delta) {
  const s = S.data.sadhanas.find((x) => x.id === id); if (!s) return;
  const t = today(); const before = logOf(s.id, t); const after = Math.max(0, before + delta);
  if (after === before) return;
  setCount(s, t, after);
  if (navigator.vibrate) navigator.vibrate(delta > 0 ? 18 : [8, 40, 8]);
  const completing = delta > 0 && before < s.daily_target && after >= s.daily_target;
  if (completing) dayComplete(s);
  render();
  const ring = document.querySelector(`.ring[data-id="${id}"]`);
  if (ring && delta > 0) {
    ring.classList.add('bump');
    const rp = document.createElement('span'); rp.className = 'ripple'; ring.appendChild(rp);
    floatAt(ring, delta === 1 ? '+1' : '+' + delta);
  }
  if (completing) {
    const card = ring && ring.closest('.card');
    const todayDot = card && [...card.querySelectorAll('.dots i')][dayStates(s).findIndex((x) => x.d === today())];
    if (todayDot) todayDot.classList.add('justdone');
  }
}
function dayComplete(s) {
  const n = dayNo(s, today());
  if (navigator.vibrate) navigator.vibrate([30, 60, 30, 60, 80]);
  const last = doneCount(s) >= s.total_days;
  const half = !last && doneCount(s) === Math.ceil(s.total_days / 2);
  const streak = streakOf(s);
  const milestone = !last && [7, 11, 21, 40, 41, 51, 108].includes(streak);
  const jai = kindOf(s).deity === 'devi' ? 'Jai Mata Di' : 'Jai Shri Ram';
  if (last) { celebrate('Sankalp complete!', `${s.total_days} days of ${s.title} 🙏`, '🏆'); petalRain(60); }
  else if (half) { celebrate('Halfway there!', `${doneCount(s)} of ${s.total_days} days · ${jai}`, '🌗'); petalRain(40); }
  else if (milestone) { celebrate(`${streak} days in a row!`, jai, '🔥'); petalRain(40); }
  else { celebrate(`Day ${n} complete`, jai, '🪔'); petalRain(22); }
  callFn({ action: 'cheer',
    title: last ? `🎉 ${me()?.name} completed the sankalp!` : `🚩 ${me()?.name} finished today's ${s.title}`,
    body: last ? `${s.total_days} days of ${s.title}. Jai Hanuman!` : `Day ${n} of ${s.total_days} done. Your turn 🙏` }).catch(() => {});
  if (last) updateSadhana(s, { status: 'completed', completed_at: new Date().toISOString() });
}
function autoComplete() {
  S.data.sadhanas.filter((s) => s.member_id === S.me && s.status === 'active').forEach((s) => {
    if (doneCount(s) >= s.total_days) updateSadhana(s, { status: 'completed', completed_at: new Date().toISOString() });
  });
}

// ------------------------------------------------------------------ UI helpers
function toast(msg, ms = 2600) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), ms);
}
function celebrate(title, sub, icon = '') {
  const b = document.createElement('div'); b.className = 'burst';
  const icons = ['🌼', '🌸', '🪔', '🚩', '✨', '🌺'];
  for (let i = 0; i < 26; i++) {
    const sp = document.createElement('span'); sp.textContent = icons[i % icons.length];
    sp.style.left = '50%'; sp.style.top = '45%';
    sp.style.setProperty('--x', (Math.random() * 360 - 180) + 'px');
    sp.style.setProperty('--y', (Math.random() * -380 + 60) + 'px');
    sp.style.setProperty('--r', (Math.random() * 360) + 'deg');
    sp.style.animationDelay = (Math.random() * .2) + 's';
    b.appendChild(sp);
  }
  const m = document.createElement('div'); m.className = 'center-msg';
  m.innerHTML = `<div>${icon ? `<span class="big">${icon}</span>` : ''}${esc(title)}<small>${esc(sub)}</small></div>`;
  document.body.append(b, m); setTimeout(() => { b.remove(); m.remove(); }, 2200);
}
const avatar = (m, size = 38) => `<div class="av" style="background:${esc(m.color)};width:${size}px;height:${size}px">${esc((m.name || '?')[0].toUpperCase())}</div>`;
const lastFrac = {};
function ringSvg(frac, done, id) {
  const r = 80, c = 2 * Math.PI * r, to = c * (1 - Math.min(1, frac));
  const from = id in lastFrac ? c * (1 - Math.min(1, lastFrac[id])) : c;   // first paint sweeps in from empty
  lastFrac[id] = frac;
  return `<svg viewBox="0 0 168 168"><circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/>
  <circle class="prog" data-to="${to}" cx="84" cy="84" r="${r}" fill="none" stroke="${done ? 'var(--ok)' : 'var(--saffron)'}" stroke-width="7" stroke-linecap="round"
   stroke-dasharray="${c}" stroke-dashoffset="${from}" style="transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)"/></svg>`;
}
function animateRings() {
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll('circle.prog').forEach((el) => el.setAttribute('stroke-dashoffset', el.dataset.to))));
}
// consecutive completed days up to today (or yesterday, if today isn't done yet)
function streakOf(s) {
  const st = dayStates(s).filter((x) => x.st !== 'excused' && x.st !== 'future');
  let i = st.length - 1, n = 0;
  if (i >= 0 && st[i].st !== 'done') i--;

  return n;
}
function floatAt(el, text) {
  if (!el) return; const r = el.getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'floater'; f.textContent = text;
  f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top + 10) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 950);
}
function petalRain(n = 34) {
  const box = document.createElement('div'); box.className = 'rain';
  const icons = ['🌼', '🌸', '🌺', '🏵️', '✨'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span'); p.textContent = icons[i % icons.length];
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px'); p.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg');
    p.style.animationDuration = (2.2 + Math.random() * 1.8) + 's'; p.style.animationDelay = (Math.random() * .9) + 's';
    p.style.fontSize = (16 + Math.random() * 16) + 'px';
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 5000);
}
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const pushOn = () => pushSupported() && Notification.permission === 'granted' && LS.get('pushOn', false);

function viewToday() {
  const t = today();
  const mine = S.data.sadhanas.filter((s) => s.member_id === S.me);
  const running = mine.filter((s) => isRunning(s, t));
  const upcoming = mine.filter((s) => isUpcoming(s, t));
  let html = '';
  if (!standalone() && !LS.get('installDismissed', false)) {
    html += `<div class="banner"><b>📲 Install Sankalp</b>Put it on your home screen — opens full screen and is needed for reminders on iPhone.
      <div class="actions"><button class="btn primary sm" data-act="install">Install app</button><button class="btn line sm" data-act="install-later">Not now</button></div></div>`;
  } else if (!pushOn() && !LS.get('pushDismissed', false)) {
    html += `<div class="banner"><b>🔔 Turn on reminders</b>${isIOS && !standalone()
      ? 'On iPhone, first tap <b style="display:inline">Share → Add to Home Screen</b>, open Sankalp from the home screen, then enable here.'

      <div class="actions"><button class="btn primary sm" data-act="push">Enable</button><button class="btn line sm" data-act="push-later">Later</button></div></div>`;
  }
  // missed-day prompts
  mine.filter((s) => s.status === 'active' && diff(s.start_date, t) > 0).forEach((s) => {
    const md = missedDates(s).filter((d) => d < t);
    if (!md.length) return;
    html += `<div class="banner miss"><b>${esc(s.title)}: ${md.length === 1 ? `Day missed — ${fmt(md[0])}` : `${md.length} days incomplete`}</b>
      Traditionally an anushthan restarts after a break. You choose:
      <div class="actions">
        <button class="btn sm line" data-act="fix-log" data-id="${s.id}">I did it, just forgot to log</button>
        <button class="btn sm line" data-act="extend" data-id="${s.id}">Continue, add ${md.length === 1 ? 'a day' : md.length + ' days'} at the end</button>
        <button class="btn sm danger" data-act="restart" data-id="${s.id}">Restart from Day 1</button>
      </div></div>`;
  });
  if (!running.length && !upcoming.length) {
    html += `<div class="card empty"><img src="icons/icon-192.png" alt=""><h3>Begin a sankalp</h3>
      <p>Pick a sadhana, choose how many days, and a start day — Tuesday or Saturday is traditional for Hanumanji.</p>
      <button class="btn primary" data-act="new">Start Hanuman Chalisa</button></div>`;
  }
  running.forEach((s) => { html += todayCard(s, t); });

      const n = diff(t, s.start_date);

      ${s.sankalp ? `<div class="sd-meta" style="margin-top:6px;font-style:italic">“${esc(s.sankalp)}”</div>` : ''}</div>`;
    });
  }

  if (!others.length) {
    html += `<div class="muted" style="font-size:14px;line-height:1.5">Invite your brother so you can see each other's progress.</div>
      <div class="actions"><button class="btn sm primary" data-act="invite">Invite</button></div>`;
  } else {
    others.forEach((m) => {
      const ss = S.data.sadhanas.filter((s) => s.member_id === m.id && isRunning(s, t));
      if (!ss.length) { html += `<div class="fam">${avatar(m)}<div class="t"><div class="n">${esc(m.name)}</div><div class="m">No active sadhana today</div></div></div>`; return; }
      ss.forEach((s) => {
        const c = logOf(s.id, t), done = c >= s.daily_target;
        html += `<div class="fam">${avatar(m)}<div class="t"><div class="n">${esc(m.name)}</div>
          <div class="m">${esc(s.title)} · Day ${dayNo(s, t) ?? '–'}/${s.total_days} · ${c}/${s.daily_target}</div></div>
          <span class="check">${done ? '✅' : '⏳'}</span></div>`;

function todayCard(s, t) {
  const c = logOf(s.id, t), done = c >= s.daily_target, n = dayNo(s, t);
  const k = kindOf(s);
  const remain = s.total_days - doneCount(s);

        <div class="inner"><div><div class="big">${done && s.daily_target === 1 ? '✓' : c}</div>
        <div class="small">${done ? 'Done today' : `of ${s.daily_target} · tap +1`}</div></div></div></div>
      <div class="side">${k.reader ? `<button class="mini" data-act="read" data-id="${s.id}" aria-label="Read">📖</button>` : `<button class="mini" data-act="fill" data-id="${s.id}" aria-label="Mark all">✓</button>`}</div>
    </div>
    <div class="hint">${done ? `🙏 ${remain > 0 ? remain + ' days to go' : 'Final day!'}` : k.reader ? 'Tap the circle after each paath, or 📖 to read along' : 'Tap after each ' + esc(s.unit) + ' · ✓ marks today complete'}</div>

async function sendCode() {
  if (!client()) return toast('Still loading — check your connection and try again');
  const el = document.getElementById('onb-email');
  const email = (el ? el.value : S.authEmail).trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter a valid email');
  if (!navigator.onLine) return toast('Connect to the internet to sign in');
  const { error } = await client().auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
  if (error) return toast(/rate|seconds/i.test(error.message) ? 'Please wait a minute before asking for another code' : 'Could not send: ' + error.message, 4500);
  S.authEmail = email; LS.set('authEmail', email); S.authStep = 'code'; render();
  setTimeout(() => document.getElementById('onb-otp')?.focus(), 100);
}
async function verifyCode() {
  const token = document.getElementById('onb-otp').value.replace(/\D/g, '');
  if (token.length < 6) return toast('Enter the code from the email');
  const { data, error } = await client().auth.verifyOtp({ email: S.authEmail, token, type: 'email' });
  if (error) return toast(/expired|invalid/i.test(error.message) ? 'That code is wrong or expired — try again or resend' : error.message, 4000);
  S.user = data.user; S.authStep = 'email';
  await loadMembership();
}
// Find which family this signed-in person belongs to.
async function loadMembership() {
  const c = client();
  const { data, error } = await c.from('sk_members').select('*').eq('user_id', S.user.id).order('created_at').limit(1);
  if (error) { toast('Could not load: ' + error.message); S.booting = false; render(); return; }
  if (data && data[0]) {
    if (S.me && S.me !== data[0].id) { S.data = { members: [], sadhanas: [], logs: [] }; S.outbox = []; LS.set('outbox', []); }
    S.family = data[0].family_code; S.me = data[0].id; LS.set('family', S.family); LS.set('me', S.me);
    LS.set('pendingJoin', null); S.pendingJoin = null; S.joinMembers = null;
    if (!S.data.members.some((m) => m.id === S.me)) S.data.members.push(data[0]);
    history.replaceState(null, '', location.pathname);
    S.booting = false; render(); await pull(); return;
  }
  // a phone that used Sankalp before email sign-in: offer to claim that family
  const legacy = S.family && /^SK-/.test(S.family) ? S.family : null;
  S.family = null; S.me = null; S.booting = false;
  const join = LS.get('pendingJoin', null) || legacy;
  if (join) await startJoin(join); else render();
}
async function createFamily() {
  const name = document.getElementById('onb-name').value.trim();
  if (!name) return toast('Please enter your name');
  if (!navigator.onLine) return toast('Connect to the internet to set up');
  const { error } = await client().rpc('sk_create_family', { p_name: name, p_color: COLORS[0], p_tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Kolkata' });
  if (error) return toast('Could not create: ' + error.message);
  S.data = { members: [], sadhanas: [], logs: [] };
  await loadMembership(); openNew();
}
async function startJoin(code) {
  code = (code || '').trim().toUpperCase();
  if (!/^SK-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) { LS.set('pendingJoin', null); render(); return toast('That code doesn’t look right'); }
  const { data, error } = await client().rpc('sk_join_info', { p_code: code });
  if (error) { LS.set('pendingJoin', null); S.pendingJoin = null; render(); return toast(/not found/.test(error.message) ? 'Family not found — check the code' : error.message); }
  S.pendingJoin = code; S.joinMembers = data || [];
  render();
}
async function doJoin(memberId, name) {
  const used = (S.joinMembers || []).map((m) => m.color);
  const { error } = await client().rpc('sk_join', { p_code: S.pendingJoin, p_member: memberId || null, p_name: name || null,
    p_color: COLORS.find((c) => !used.includes(c)) || COLORS[1], p_tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Kolkata' });
  if (error) return toast('Could not join: ' + error.message);
  S.data = { members: [], sadhanas: [], logs: [] };
  await loadMembership();
  toast('Welcome to the family 🙏');
}
async function signOut(ask = true) {
  if (ask && !confirm('Sign out of Sankalp on this phone? Your data stays saved — sign in again with your email any time.')) return;
  await disablePush().catch(() => {});
  await client().auth.signOut().catch(() => {});
  ['family', 'me', 'data', 'outbox', 'pushOn', 'pushDismissed', 'pendingJoin'].forEach((k) => localStorage.removeItem('sk.' + k));
  Object.assign(S, { family: null, me: null, user: null, data: { members: [], sadhanas: [], logs: [] }, outbox: [], joinMembers: null, pendingJoin: null, authStep: 'email' });
  render();
}

function readForm() {

function createSadhanas() {
  readForm(); const f = S.form;
  const days = Math.round(+f.days), count = Math.round(+f.count);
  const title = (f.title || '').trim();
  if (!title) return toast('Give the sadhana a name');
  if (!(days >= 1 && days <= 1000)) return toast('Days should be 1–1000');
  if (!(count >= 1 && count <= 10000)) return toast('Count per day should be at least 1');
  if (!f.start) return toast('Pick a start date');
  const now = new Date().toISOString();
  f.who.forEach((mid) => {
    const s = { id: uid(), family_code: S.family, member_id: mid, kind: f.kind, title, unit: (f.unit || 'times').trim(),
      daily_target: count, total_days: days, start_date: f.start, excused_dates: [], reminder_time: f.reminder || null,
      nudge_time: f.nudgeOn && f.nudge ? f.nudge : null, sankalp: f.sankalp.trim() || null, status: 'active', created_at: now, updated_at: now };
    S.data.sadhanas.push(s);
    queue({ t: 'upsert', table: 'sk_sadhanas', row: s, key: 'sd:' + s.id });
  });
  save(); closeSheet(); S.tab = 'today'; render();
  toast(f.start === today() ? 'Sankalp taken. Day 1 begins now 🙏' : `Sankalp set — begins ${fmt(f.start)}`);
  if (!pushOn() && pushSupported()) setTimeout(() => toast('Tip: enable reminders so you never miss a day'), 2800);
}
function saveEdit() {
  readForm(); const f = S.form; const s = S.data.sadhanas.find((x) => x.id === f.id);
  if (!f.title.trim()) return toast('Name can’t be empty');
  const count = Math.round(+f.count), days = Math.round(+f.days), t = today();
  if (!(count >= 1 && count <= 10000)) return toast('Count per day should be at least 1');
  if (!(days >= 1 && days <= 1000)) return toast('Days should be 1–1000');
  const patch = { title: f.title.trim(), sankalp: f.sankalp.trim() || null, reminder_time: f.reminder || null,
    nudge_time: f.nudgeOn && f.nudge ? f.nudge : null, last_reminded_on: null, last_nudged_on: null, total_days: days };
  if (s.start_date > t) {
    if (!f.start) return toast('Pick a start date');
    patch.start_date = f.start; patch.daily_target = count;
  } else if (count !== s.daily_target) {
    // remember the old count for days before today so they don't turn into "missed"
    const h = (s.target_history || []).filter((x) => x.until <= t);
    if (s.start_date < t && !h.some((x) => x.until === t)) h.push({ until: t, target: s.daily_target });
    patch.target_history = h; patch.daily_target = count;
  }
  if (days < doneCount(s)) return toast(`You've already completed ${doneCount(s)} days`);
  const was = s.status;
  updateSadhana(s, patch);
  if (was === 'active' && doneCount(s) >= s.total_days && logOf(s.id, t) >= s.daily_target) {
    updateSadhana(s, { status: 'completed', completed_at: new Date().toISOString() });
  }
  closeSheet(); render(); toast('Saved');
}

      <div class="doha" style="margin:-6px 0 14px"><small>${tr('चौपाई')}</small></div>
      ${S.script === 'tel'
        ? CHALISA_TE_VERSES.map((pair) => `<div class="verse"><span class="tx">${pair.map((l) => esc(l).replace(/\s*(\[[^\]]*\])/g, ' <span class="alt">$1</span>')).join('<br>')}</span></div>`).join('')
        : CHALISA.verses.map((v, i) => `<div class="verse"><span class="no">${i + 1}</span><span class="tx">${tr(v).replace(/। /, '।<br>')}</span></div>`).join('')}
      <div class="doha"><small>${tr('दोहा')}</small>${CHALISA.close.map(tr).join('<br>')}</div>
      <div class="doha" style="font-size:.85em">॥ ${tr('इति')} ॥</div>`;
  }
  const target = s.daily_target;
  document.getElementById('layer').innerHTML = `<div class="reader ${S.script === 'tel' ? 'tel' : ''}">
    <header><button class="btn sm line" data-act="close-reader">✕</button><div class="ttl">${kind === 'saptashloki' ? title : tr(title)}</div>
      <div class="seg"><button class="${S.script === 'dev' ? 'on' : ''}" data-act="rscript" data-id="dev">अ</button><button class="${S.script === 'tel' ? 'on' : ''}" data-act="rscript" data-id="tel">అ</button></div>
      <button class="btn sm line" data-act="font" data-id="-2">A−</button><button class="btn sm line" data-act="font" data-id="2">A+</button></header>
    <div class="body" id="rbody" style="font-size:${S.fs}px">${body}</div>
    <footer><button class="btn primary block" data-act="reader-done" style="padding:16px">✓ Paath complete · ${Math.min(c + 1, target)} of ${target}</button></footer></div>`;
}

// ------------------------------------------------------------------ push
function b64ToU8(s) { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...b].map((c) => c.charCodeAt(0))); }
async function enablePush() {
  if (!pushSupported()) { toast(isIOS ? 'First add Sankalp to your Home Screen, then open it from there' : 'Notifications not supported in this browser', 4200); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications were blocked — allow them in your phone settings', 4000); return; }
    const reg = await navigator.serviceWorker.ready;
    const { publicKey } = await callFn({ action: 'vapid' });
    let sub = await reg.pushManager.getSubscription();
    if (sub && LS.get('vapid', null) !== publicKey) { await sub.unsubscribe(); sub = null; }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(publicKey) });
    LS.set('vapid', publicKey);
    const j = sub.toJSON();
    const r = await client().from('sk_push_subs').upsert({ endpoint: j.endpoint, family_code: S.family, member_id: S.me, p256dh: j.keys.p256dh, auth: j.keys.auth });
    if (r.error) throw r.error;
    LS.set('pushOn', true); render();
    await callFn({ action: 'test' });
    toast('Reminders on 🔔');
  } catch (e) { console.error(e); toast('Could not enable: ' + (e.message || e)); }
}
async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
    if (sub) { await client().from('sk_push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  } catch {}
  LS.set('pushOn', false); render();
}

// ------------------------------------------------------------------ events
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const sd = () => S.data.sadhanas.find((x) => x.id === id);
  switch (act) {
    case 'tab': if (S.tab !== id) { S.tab = id; S.enter = true; } render(); scrollTo(0, 0); break;
    case 'inc': tap(id, 1); break;
    case 'dec': tap(id, -1); break;
    case 'fill': { const s = sd(); tap(id, s.daily_target - logOf(id, today())); break; }
    case 'read': openReader(id); break;
    case 'close-reader': document.getElementById('layer').innerHTML = ''; S.reader = null; S.readIntro = null; render(); break;
    case 'reader-done': {
      const rid = S.reader; const s = sd() || S.data.sadhanas.find((x) => x.id === rid);
      const before = logOf(rid, today()); tap(rid, 1);
      if (kindOf(s).reader === 'saptashloki' && before + 1 < s.daily_target) {
        S.readIntro = rid; openReader(rid); document.getElementById('rbody').scrollTop = 0; toast(`${before + 1} of ${s.daily_target} 🙏`, 1200);
      } else { document.getElementById('layer').innerHTML = ''; S.reader = null; S.readIntro = null; render(); }
      break; }
    case 'rscript': S.script = id; LS.set('script', id); openReader(S.reader); break;
    case 'font': { S.fs = Math.min(34, Math.max(16, S.fs + +id)); LS.set('fs', S.fs); document.getElementById('rbody').style.fontSize = S.fs + 'px'; break; }
    case 'script': S.script = id; LS.set('script', id); render(); break;
    case 'new': openNew(); break;
    case 'edit': openEdit(id); break;
    case 'sheet-bg': if (e.target === el) closeSheet(); break;
    case 'kind': { readForm(); const k = KINDS[id]; const dd = deityOf(id).days;
      const st = dd.includes(new Date().getDay()) ? today() : dd.map((w) => nextWeekday(w)).sort()[0];
      Object.assign(S.form, { kind: id, title: k.title, unit: k.unit, plan: 0, days: k.plans[0].days, count: k.plans[0].count, start: st }); rerenderSheet(); break; }
    case 'plan': { readForm(); const p = KINDS[S.form.kind].plans[+id]; Object.assign(S.form, { plan: +id, days: p.days, count: p.count }); rerenderSheet(); break; }
    case 'start': readForm(); S.form.start = id; rerenderSheet(); break;
    case 'who': { readForm(); const w = S.form.who; S.form.who = w.includes(id) ? (w.length > 1 ? w.filter((x) => x !== id) : w) : [...w, id]; rerenderSheet(); break; }
    case 'nudge-toggle': readForm(); S.form.nudgeOn = !S.form.nudgeOn; rerenderSheet(); break;
    case 'create-sadhana': createSadhanas(); break;
    case 'save-edit': saveEdit(); break;
    case 'stop': if (confirm('Stop this sadhana? It stays in your history.')) { updateSadhana(S.data.sadhanas.find((x) => x.id === S.form.id), { status: 'stopped' }); closeSheet(); render(); } break;
    case 'delete': if (confirm('Delete this sadhana and all its logs?')) {
      const did = S.form.id; S.data.sadhanas = S.data.sadhanas.filter((x) => x.id !== did); S.data.logs = S.data.logs.filter((l) => l.sadhana_id !== did);
      save(); queue({ t: 'delete', table: 'sk_sadhanas', id: did }); closeSheet(); render(); } break;
    case 'fix-log': { const s = sd(); missedDates(s).filter((d) => d < today()).forEach((d) => setCount(s, d, targetOn(s, d))); autoComplete(); render(); toast('Logged 🙏'); break; }
    case 'extend': { const s = sd(); const md = missedDates(s).filter((d) => d < today()); updateSadhana(s, { excused_dates: [...exc(s), ...md] }); render(); toast(`Extended — now ends ${fmt(endDate(s))}`); break; }
    case 'restart': { const s = sd();
      if (!confirm(`Restart ${s.title} from Day 1 today?`)) break;
      updateSadhana(s, { status: 'broken' });
      const now = new Date().toISOString();
      const n = { ...s, id: uid(), start_date: today(), excused_dates: [], status: 'active', completed_at: null, last_reminded_on: null, last_nudged_on: null, created_at: now, updated_at: now };
      S.data.sadhanas.push(n); save(); queue({ t: 'upsert', table: 'sk_sadhanas', row: n, key: 'sd:' + n.id }); render(); toast('Day 1 begins today. Jai Hanuman 🚩'); break; }
    case 'push': enablePush(); break;
    case 'push-off': disablePush(); break;
    case 'push-later': LS.set('pushDismissed', true); render(); break;
    case 'install-later': LS.set('installDismissed', true); render(); break;
    case 'push-test': { const r = await callFn({ action: 'test' }); toast(r.sent ? 'Sent — check your notifications' : 'No device registered — toggle reminders off and on'); break; }
    case 'invite': {
      const link = location.origin + location.pathname + '?join=' + encodeURIComponent(S.family);
      const text = `Join me on Sankalp — our Hanuman Chalisa tracker 🚩\n${link}\n(Code: ${S.family})`;
      if (navigator.share) navigator.share({ title: 'Sankalp', text }).catch(() => {});
      else { navigator.clipboard?.writeText(text); toast('Invite copied — paste it to your brother'); }
      break; }
    case 'copy': navigator.clipboard?.writeText(id).then(() => toast('Link copied')); break;
    case 'color': { const m = me(); m.color = id; save(); queue({ t: 'update', table: 'sk_members', id: m.id, row: { color: id } }); render(); break; }
    case 'savename': { const v = document.getElementById('myname').value.trim(); if (!v) break; const m = me(); m.name = v; save(); queue({ t: 'update', table: 'sk_members', id: m.id, row: { name: v } }); render(); toast('Saved'); break; }
    case 'refresh': await pull(); toast('Synced'); break;
    case 'logout': signOut(true); break;
    case 'logout-quiet': signOut(false); break;
    case 'send-code': sendCode(); break;
    case 'verify': verifyCode(); break;
    case 'auth-back': S.authStep = 'email'; render(); break;
    case 'install': install(); break;
    case 'close-sheet': closeSheet(); break;
    case 'create': createFamily(); break;
    case 'join': startJoin(id); break;
    case 'join-code': startJoin(document.getElementById('onb-code').value); break;
    case 'join-cancel': S.joinMembers = null; S.pendingJoin = null; LS.set('pendingJoin', null); render(); break;
    case 'pick-me': doJoin(id, null); break;
    case 'join-new': { const n = document.getElementById('onb-name').value.trim(); if (!n) { toast('Please enter your name'); break; } doJoin(null, n); break; }
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'onb-email') sendCode();
  else if (e.target.id === 'onb-otp') verifyCode();
});
document.addEventListener('change', (e) => {
  if (!S.form || !e.target.matches('.sheet [data-f]')) return;
  readForm();
  const k = e.target.dataset.f;
  // update in place — re-drawing here would swallow a tap on Save
  if ((k === 'days' || k === 'count') && S.form.mode === 'new' && S.form.plan !== -1) {
    S.form.plan = -1; document.querySelectorAll('.plans .chip.on').forEach((c) => c.classList.remove('on'));
  }
  if (k === 'start' || k === 'days') { const el = document.getElementById('enddate'); if (el) el.textContent = endText(); }
  if (k === 'start') document.querySelectorAll('.sheet [data-act=start]').forEach((c) => c.classList.toggle('on', c.dataset.id === S.form.start));
  if (k === 'unit') { const el = document.getElementById('unitlbl'); if (el) el.textContent = (S.form.unit || 'times').replace(/^./, (c) => c.toUpperCase()) + 's per day'; }
});

// ------------------------------------------------------------------ boot
window.addEventListener('online', () => { renderSync(); pull(); });
window.addEventListener('offline', renderSync);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { pull(); if (S.tab === 'today' && !S.form && !S.reader) render(); } });
setInterval(() => { if (document.visibilityState === 'visible' && !S.form) pull(); }, 30000);
// re-render at midnight so the day rolls over
let lastDay = today(); setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!S.form && !S.reader) render(); } }, 60000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data?.type === 'refresh') pull(); });
}
// keep ?join= across the email sign-in
const joinParam = new URLSearchParams(location.search).get('join');
if (joinParam) LS.set('pendingJoin', joinParam.trim().toUpperCase());
render();
(async () => {
  const c = client();
  if (!c) { S.booting = false; render(); return toast('Could not load — check your connection'); }
  const { data, error: linkErr } = await c.auth.getSession();
  S.user = data?.session?.user || null;
  // arrived from the email link: tidy the address bar
  if (/access_token|error_description/.test(location.hash)) {
    if (/error_description/.test(location.hash)) toast('That sign-in link has expired — ask for a new code', 4500);
    history.replaceState(null, '', location.pathname + location.search);
  }
  if (S.user && S.family && S.me && me()) { S.booting = false; render(); pull(); loadMembership(); }
  else if (S.user) await loadMembership();
  else { S.booting = false; render(); }
  c.auth.onAuthStateChange((ev, session) => {
    if (ev === 'SIGNED_OUT' && S.user) { S.user = null; render(); }
    if (session?.user) S.user = session.user;
  });
})();
</script>
